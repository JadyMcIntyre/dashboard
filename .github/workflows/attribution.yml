name: Verify attribution and provenance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify source and build attribution
        run: python3 -m unittest discover -s tests -v
